name: Bug report
description: Something does not work as the reference documents say it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. **Never paste real employee data** (NIK, names, family data, assessment scores, certificates) or screenshots that show it. Use demo data (`composer demo`) to reproduce. For a security problem, do not open an issue: follow the security policy.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh `composer setup` and `composer demo` if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen, and which rule says so (a section of the reference documents, if you know it).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, PHP version, browser, and the commit or branch.
      placeholder: "Windows 11, PHP 8.4.1, Chrome 140, main at 1a2b3c4"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm this report contains no real employee data and no screenshots showing it.
          required: true
