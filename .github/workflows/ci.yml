name: CI

# Quality gate for every pull request and every push to main (ENGINEERING.md §3.4, §4):
# Pint, the PHPUnit suite, dependency audits, JavaScript unit tests and the production asset build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pint, audit, PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, xml, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Views use @vite(), so the manifest must exist for the feature tests.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Composer audit
        run: composer audit --no-interaction

      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (audit, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: npm audit (high and critical block the build)
        run: npm audit --audit-level=high

      - name: JavaScript unit tests
        run: npm run test:js
